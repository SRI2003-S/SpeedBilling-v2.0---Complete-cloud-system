server:
  port: 8080

spring:
  application:
    name: speedbilling-backend

  datasource:
    url: ${RENDER_DB_URL:jdbc:postgresql://dpg-d8gj8pt7vvec7390u52g-a.oregon-postgres.render.com:5432/speedbilling?sslmode=require}
    username: ${RENDER_DB_USER:speedbilling_user}
    password: ${RENDER_DB_PASSWORD:QC91RjjnOFzr2HqvK3paRFjyxZcyLJgv}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  session:
    timeout: 28800  # 8 hours in seconds
    cookie:
      name: JSESSIONID
      path: /
      secure: true
      http-only: true

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
  storage:
    url: ${SUPABASE_STORAGE_URL:https://your-project.supabase.co/storage/v1}
    bucket: ${SUPABASE_BUCKET:hair-extension-photos}
    max-file-size: 5242880  # 5MB in bytes

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    com.speedbilling: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

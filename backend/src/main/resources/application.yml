server:
  port: 8080

spring:
  application:
    name: speedbilling-backend

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://bjpmvqgjfakidbmuibpu.supabase.co:6543/postgres?sslmode=require&pgbouncer=true&prepareThreshold=0}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:Srinesh@2003}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  session:
    timeout: 28800  # 8 hours in seconds

# Supabase Configuration
supabase:
  url: ${SUPABASE_URL:https://your-project.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
  storage:
    url: ${SUPABASE_STORAGE_URL:https://your-project.supabase.co/storage/v1}
    bucket: ${SUPABASE_BUCKET:hair-extension-photos}
    max-file-size: 5242880  # 5MB in bytes

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    com.speedbilling: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Billing Admin</title>
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
    <script src="{{ url_for('static', filename='lucide.min.js') }}"></script>
    <!-- <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/lucide-icons/dist/umd/lucide.min.js" rel="stylesheet"> -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .nav-link.active { color: #3b82f6; font-weight: 600; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center gap-2">
                        <span class="font-bold text-xl tracking-tight text-gray-900">Speed Billing<span class="text-blue-500"> Admin</span></span>
                    </div>
                    
                    <div class="hidden sm:ml-10 sm:flex sm:space-x-8">
                        <a href="/admin/stocks" class="border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Stock Inventory
                        </a>
                        <a href="/admin/cash_management" class="border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Cash Management
                        </a>
                        <a href="/admin/shifts" class="border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Shift Management</a>
                        <a href="/admin/users" class="border-transparent text-gray-500 hover:text-gray-900 hover:border-gray-300 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">User Management</a>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="text-sm text-right hidden sm:block">
                        <div class="font-medium text-gray-900">Administrator</div>
                        <div class="text-xs text-gray-500">Store Manager</div>
                    </div>
                    <a href="/logout" class="bg-gray-100 hover:bg-gray-200 text-gray-600 p-2 rounded-full transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
        
        // Highlight Active Link Logic
        const currentPath = window.location.pathname;
        document.querySelectorAll('nav a').forEach(link => {
            if(link.getAttribute('href') === currentPath) {
                link.classList.add('border-blue-500', 'text-gray-900');
                link.classList.remove('border-transparent', 'text-gray-500');
            }
        });
    </script>
</body>
</html>

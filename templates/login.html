<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Speed Billing</title>
    
    <!-- Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="{{ url_for('static', filename='tailwind.min.js') }}"></script>
    <script src="{{ url_for('static', filename='lucide.min.js') }}"></script>
    
    <!-- Lucide Icons -->
    <!-- <script src="https://unpkg.com/lucide@latest"></script> -->

    <style>
        .fade-in { 
            animation: fadeIn 0.5s ease-out; 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100 font-sans text-gray-800">

    <div class="w-full max-w-md p-4 fade-in">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            
            <!-- Header Section -->
            <div class="bg-gray-900 p-8 text-center">
                <div class="inline-flex items-center gap-2 font-bold text-2xl tracking-tight text-white mb-2">
                    <!-- Simple Logo Icon -->
                    <span>Speed Billing</span>
                </div>
                <p class="text-gray-400 text-sm">Sign in to start your shift</p>
            </div>

            <!-- Form Section -->
            <div class="p-8 pt-10">
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6" method="post" action="/login">
                    
                    <!-- Username -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Username / ID</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="user" class="w-5 h-5 text-gray-400"></i>
                            </div>
                            <input type="text" name="username" id="username"class="w-full pl-12 p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors font-medium text-gray-700 bg-gray-50 focus:bg-white" placeholder="Enter your ID" required autofocus >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                            </div>
                            <input type="password" name="password" id="password" class="w-full pl-12 p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500 transition-colors font-medium text-gray-700 bg-gray-50 focus:bg-white" placeholder="••••••••" required >
                        </div>
                    </div>

                    <!-- Error Message (Hidden by default, toggle with JS) -->
                    <div id="errorMsg" class="hidden text-red-500 text-sm font-medium text-center flex items-center justify-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i>
                        <span>Invalid credentials. Try again.</span>
                    </div>

                    {% if error %}
                        <div style="color: red; text-align: center; margin-bottom: 10px;">{{ error }}</div>
                    {% endif %}

                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        id="loginBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl shadow-lg hover:shadow-blue-200 transition-all active:scale-95 flex justify-center items-center gap-2"
                    >
                        <span>LOGIN TO DASHBOARD</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>

                </form>

                <div class="mt-8 text-center text-xs text-gray-400">
                    <p>Forgot password? Contact Administrator.</p>
                    <p class="mt-2">Version 1.2.0 • Secured POS System</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
